<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Govind Malav - Full Stack Developer specializing in MERN Stack, React, Node.js. Building scalable B2B solutions and innovative web applications.">
    <meta name="keywords" content="Govind Malav, Full Stack Developer, React, Node.js, MongoDB, JavaScript, CSE, LPU">
    <title>Govind Malav | Full Stack Developer & CS Engineer</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js"></script>


    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        primary: '#00f2ea',
                        secondary: '#ff00ff',
                        accent: '#7928ca',
                        dark: '#0a0a0a',
                        'dark-lighter': '#1a1a1a',
                        'dark-card': '#161616',
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 12s linear infinite',
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Skill bar gradient (Tailwind JIT-safe inline rule) -->
    <style>
        .skill-bar {
            height: 100%;
            border-radius: 9999px;
            background: linear-gradient(90deg, #00f2ea, #ff00ff);
            transition: width 1s ease;
        }
    </style>
</head>

<body class="antialiased selection:bg-primary selection:text-black">

    <!-- Scroll Progress Bar -->
    <div class="scroll-progress" id="scrollProgress"></div>

    <!-- Custom Cursor -->
    <div class="cursor-dot hidden md:block"></div>
    <div class="cursor-outline hidden md:block"></div>

    <!-- Three.js Background -->
    <div id="canvas-container"></div>

    <!-- Inject HTML Sections using Vite custom plugin defined in vite.config.js -->
    <include src="./sections/navbar.html" />
    <include src="./sections/hero.html" />
    <include src="./sections/stats.html" />
    <include src="./sections/about.html" />
    <include src="./sections/skills.html" />
    <include src="./sections/projects.html" />
    <include src="./sections/experience.html" />
    <include src="./sections/achievements.html" />
    <include src="./sections/services.html" />
    <include src="./sections/contact.html" />
    <include src="./sections/footer.html" />

    <!-- Back to Top Button -->
    <div class="back-to-top hoverable" id="backToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <i class="fas fa-arrow-up text-white"></i>
    </div>

    <!-- Three.js Background (ES Module) -->
    <script type="module" src="js/three-bg.js"></script>

    <!-- Main Interactions: GSAP, Typed.js, Cursor, Scroll, Form -->
    <script type="module" src="./js/main.js"></script>

</body>

</html>
